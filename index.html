<style>
:root{
  --ground:#EEF3F6; --surface:#FFFFFF; --surface-2:#F6F9FB; --line:#D5E0E7;
  --ink:#0E1D24; --ink-2:#405A66; --ink-3:#7A929E;
  --accent:#00587C; --accent-ink:#FFFFFF; --accent-soft:#DCEAF1;
  --gold:#A96D12; --gold-soft:#F7ECD9;
  --good:#0C7F74; --good-soft:#DDEFEC;
  --warn:#A8452E; --warn-soft:#F7E4DF;
  --shadow:0 1px 2px rgba(10,35,45,.06), 0 6px 18px rgba(10,35,45,.07);
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A161B; --surface:#12232B; --surface-2:#172C35; --line:#24414C;
    --ink:#E6EFF3; --ink-2:#A6BFCA; --ink-3:#7793A0;
    --accent:#5AAFD1; --accent-ink:#04222E; --accent-soft:#16333F;
    --gold:#E0A960; --gold-soft:#32281A;
    --good:#4FC0B2; --good-soft:#12302E;
    --warn:#E08C74; --warn-soft:#331F19;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0A161B; --surface:#12232B; --surface-2:#172C35; --line:#24414C;
  --ink:#E6EFF3; --ink-2:#A6BFCA; --ink-3:#7793A0;
  --accent:#5AAFD1; --accent-ink:#04222E; --accent-soft:#16333F;
  --gold:#E0A960; --gold-soft:#32281A;
  --good:#4FC0B2; --good-soft:#12302E;
  --warn:#E08C74; --warn-soft:#331F19;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:"Familjen Grotesk","Public Sans",system-ui,sans-serif;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px}

header.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.iconbtn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:9px 11px;line-height:0}
.stats{display:flex;gap:8px;padding-bottom:12px;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:1 1 0;min-width:104px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;font-family:"Familjen Grotesk",sans-serif}
.stat span{display:block;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:1px}

.tools{display:flex;gap:8px;align-items:center;padding-block:14px 8px;flex-wrap:wrap}
.search{flex:1 1 170px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:15px}
.search::placeholder{color:var(--ink-3)}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:2px}
.seg button{all:unset;cursor:pointer;padding:7px 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:519px){
  .tools{gap:6px}
  .search{flex-basis:100%}
  .tools .btn,.tools select.sel{padding:9px 11px;font-size:13.5px}
  .seg button{padding:7px 10px}
  #sort{flex:1 1 auto;min-width:0}
  .tools .btn{flex:1 1 auto}
}

ul.list{list-style:none;margin:0;padding:0 0 26px;display:flex;flex-direction:column;gap:8px}
li.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:10px 12px}
li.row button.open{all:unset;display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
.ava{width:44px;height:44px;border-radius:50%;flex:none;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;color:var(--accent);font-size:14px;font-family:"Familjen Grotesk",sans-serif;overflow:hidden;border:1px solid var(--line)}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.who span.ticks{display:flex;gap:3px;margin-top:5px}
.tick{display:block;width:13px;height:4px;border-radius:2px;background:var(--line)}
.tick.on{background:var(--accent)}
.pill{flex:none;min-width:62px;text-align:center;border-radius:999px;padding:6px 10px;font-weight:700;font-size:15px;font-family:"Familjen Grotesk",sans-serif;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.mid{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.low{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding-bottom:26px}
.face{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.face .ava{width:62px;height:62px;font-size:18px}
.face b{font-size:12.5px;font-weight:600;line-height:1.25;word-break:break-word}
.face i{font-style:normal;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.face.nophoto{border-style:dashed}

.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 18px;margin-bottom:26px;text-align:center}
.empty h2{margin:0 0 6px;font-size:19px}
.empty p{margin:0 auto 16px;max-width:46ch;color:var(--ink-2);font-size:14px}
.empty .row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty.left{text-align:left}
.empty.left p{margin-inline:0}

.sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(8,24,31,.44);backdrop-filter:blur(2px)}
.sheet[data-open="1"]{display:block}
.sheet-in{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;background:var(--ground);border-radius:20px 20px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:720px){.sheet-in{left:50%;transform:translateX(-50%);width:660px;border-radius:20px;bottom:auto;top:3.5%;max-height:90%}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}
.sheet-top{position:sticky;top:0;background:var(--ground);padding-top:14px;padding-bottom:10px;z-index:2;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sheet-top .ava{width:52px;height:52px;font-size:16px}
.sheet-top h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sheet-top p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.close{all:unset;cursor:pointer;padding:8px 10px;border-radius:10px;color:var(--ink-2);font-size:20px;line-height:1}
.photo-actions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.danger{color:var(--warn);border-color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3 em{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.card p.hint{margin:4px 0 12px;font-size:12.5px;color:var(--ink-3)}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:520px){.grid6{grid-template-columns:repeat(6,1fr)}}
.slot{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:7px 8px;text-align:center}
.slot label{display:block;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:3px}
.slot input{width:100%;border:0;background:transparent;text-align:center;font-size:19px;font-weight:700;font-family:"Familjen Grotesk",sans-serif;padding:1px 0;border-radius:6px}
.slot input::placeholder{color:var(--ink-3);font-weight:500}
.slot.filled{border-color:var(--accent);background:var(--accent-soft)}
.one input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:22px;font-weight:700;font-family:"Familjen Grotesk",sans-serif;text-align:center}
.quickrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.quick.clear{color:var(--warn)}
.total{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.total span{font-size:12.5px;font-weight:600;opacity:.9;letter-spacing:.03em}
.total b{font-size:32px;font-weight:700;font-family:"Familjen Grotesk",sans-serif;letter-spacing:-.02em}
.detail{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;opacity:.92;margin-top:4px}
textarea.memo,input.txt{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px}
textarea.memo{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abs{display:flex;gap:6px;flex-wrap:wrap}
.absbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:600}
.absbtn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.absgrid{display:flex;flex-direction:column;gap:6px}
.absline{display:flex;align-items:center;gap:6px}
.absnom{flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.absline .absbtn{flex:0 0 auto;min-width:104px;text-align:center}
@media (max-width:420px){ .absline .absbtn{min-width:88px;padding:6px 8px;font-size:12.5px} }
.banner{border-radius:12px;padding:10px 13px;font-size:13px;margin-block:12px;background:var(--gold-soft);color:var(--gold)}
.banner.bad{background:var(--warn-soft);color:var(--warn)}
.banner.ok{background:var(--good-soft);color:var(--good)}
footer.foot{padding-block:8px 30px;color:var(--ink-3);font-size:12px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:90;box-shadow:var(--shadow);max-width:90vw;text-align:center}
code.liaison{display:block;word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px}
.dot.off{background:var(--ink-3)} .dot.wait{background:var(--gold)}
</style>

<script>
"use strict";

/* ================================================================
   Carnet de notes MIL
   La page est servie par GitHub Pages ; les notes vivent dans une
   feuille Google Sheets, atteinte par un service Google Apps Script.
   L'adresse du service et la clé d'accès ne sont pas dans ce fichier :
   elles sont saisies une fois par appareil et gardées en local.
   ================================================================ */

const W = { quiz:0.30, ateliers:0.30, examen:0.40 };
const SEANCES = [1,2,3,4,5,6];
const K_CFG = "carnet-mil-cfg";
const K_CACHE = "carnet-mil-cache";
const K_FILE = "carnet-mil-file";
const K_THEME = "carnet-mil-theme";

const state = {
  students: [], cfg: null, open: null, q: "", sort: "nom", view: "list",
  file: [], sync: "off", charge: false
};
const photos = {};                       // idPhoto -> data URL

const el = s => document.querySelector(s);
const blank = () => ({ quiz:[null,null,null,null,null,null], ateliers:[null,null,null,null,null,null],
                       examen:null, abs:[], memo:"", photo:null });
const find = id => state.students.find(s => s.id === id);
const newId = () => "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ---------------- stockage local ---------------- */
function lire(cle, defaut){ try{ const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; }catch(_){ return defaut; } }
function ecrire(cle, val){ try{ localStorage.setItem(cle, JSON.stringify(val)); }catch(_){} }

/* La configuration est écrite à trois endroits différents, et relisible depuis
   le lien personnel. Un navigateur qui nettoie l'un garde presque toujours les
   autres : on ne redemande plus l'adresse et la clé à chaque ouverture. */
const encoder = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
function decoder(code){
  if(!code) return null;
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(String(code).trim()))));
    return (o && o.url && o.cle) ? { url:o.url, cle:o.cle } : null;
  }catch(_){ return null; }
}
function cookieLire(nom){
  try{
    const m = document.cookie.match(new RegExp("(?:^|; )" + nom + "=([^;]*)"));
    return m ? decodeURIComponent(m[1]) : null;
  }catch(_){ return null; }
}
function cookieEcrire(nom, val){
  try{
    document.cookie = nom + "=" + encodeURIComponent(val) + ";path=/;max-age=34560000;SameSite=Lax"
      + (location.protocol === "https:" ? ";Secure" : "");
  }catch(_){}
}
async function cfgLire(){
  const m = location.hash.match(/[#&]c=([A-Za-z0-9+/=_%-]+)/);
  if(m){
    const o = decoder(decodeURIComponent(m[1]));
    if(o){ try{ history.replaceState(null, "", location.pathname + location.search); }catch(_){} return o; }
  }
  const l = lire(K_CFG, null);
  if(l && l.url && l.cle) return l;
  const c = decoder(cookieLire("cmil"));
  if(c) return c;
  const b = decoder(await avecDelai(idb.get("cfg"), 2000, null));
  if(b) return b;
  return null;
}
function cfgEcrire(cfg){
  ecrire(K_CFG, cfg);
  const code = encoder(cfg);
  cookieEcrire("cmil", code);
  idb.set("cfg", code);
}
function lienPersonnel(){
  return location.origin + location.pathname + "#c=" + encodeURIComponent(encoder(state.cfg));
}

/* ---------------- petit cache de photos ---------------- */
/** Renvoie la valeur par défaut si l'attente dépasse le délai : la base locale
    d'un navigateur peut rester bloquée, et rien ne doit figer l'application. */
function avecDelai(promesse, ms, defaut){
  return Promise.race([promesse, new Promise(r => setTimeout(() => r(defaut), ms))]);
}

const idb = {
  p: null,
  ouvrir(){
    if(this.p) return this.p;
    this.p = avecDelai(new Promise(res => {
      let q;
      try{ q = indexedDB.open("carnet-mil", 1); }catch(_){ return res(null); }
      q.onupgradeneeded = () => { try{ q.result.createObjectStore("photos"); }catch(_){} };
      q.onsuccess = () => res(q.result);
      q.onerror = () => res(null);
      q.onblocked = () => res(null);
    }), 2000, null);
    return this.p;
  },
  async get(k){
    const db = await this.ouvrir(); if(!db) return null;
    return new Promise(res => {
      try{
        const r = db.transaction("photos").objectStore("photos").get(k);
        r.onsuccess = () => res(r.result || null); r.onerror = () => res(null);
      }catch(_){ res(null); }
    });
  },
  async set(k, v){
    const db = await this.ouvrir(); if(!db) return;
    return new Promise(res => {
      try{
        const r = db.transaction("photos","readwrite").objectStore("photos").put(v, k);
        r.onsuccess = () => res(); r.onerror = () => res();
      }catch(_){ res(); }
    });
  }
};

/* ---------------- appel du service Google ---------------- */
async function api(action, charge){
  if(!state.cfg) throw new Error("non configuré");
  const corps = Object.assign({ cle: state.cfg.cle, action }, charge || {});
  // « text/plain » évite la requête préalable CORS, qu'Apps Script ne traite pas.
  const rep = await fetch(state.cfg.url, {
    method: "POST", redirect: "follow",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(corps)
  });
  if(!rep.ok) throw new Error("http " + rep.status);
  const data = await rep.json();
  if(data && data.erreur === "cle") throw Object.assign(new Error("cle"), { cle: true });
  if(data && data.erreur) throw new Error(data.message || data.erreur);
  return data;
}

/* ---------------- calcul ---------------- */
function mean(arr){
  const v = arr.filter(x => typeof x === "number");
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
/** La plus faible des six notes de quiz est écartée dès que les six sont saisies. */
function meanQuiz(arr){
  const v = arr.filter(x => typeof x === "number");
  if(!v.length) return null;
  if(v.length === 6){ const s = [...v].sort((a,b)=>a-b); s.shift(); return mean(s); }
  return mean(v);
}
function moyenne(s){
  const q = meanQuiz(s.quiz), a = mean(s.ateliers), e = typeof s.examen === "number" ? s.examen : null;
  const parts = [[q,W.quiz],[a,W.ateliers],[e,W.examen]].filter(p => p[0] !== null);
  if(!parts.length) return null;
  const pw = parts.reduce((t,p)=>t+p[1],0);
  return parts.reduce((t,p)=>t+p[0]*p[1],0)/pw;
}
const complete = s => s.quiz.some(x=>x!==null) && s.ateliers.some(x=>x!==null) && s.examen!==null;

/* Absences : un code par demi-séance. « 3a » = avant la pause, « 3b » = après.
   Les anciennes données, qui ne connaissaient que la séance entière, sont converties. */
function normAbs(a){
  const out = [];
  (a || []).forEach(v => {
    const t = String(v).trim().toLowerCase();
    if(/^[1-6]$/.test(t)){ out.push(t + "a", t + "b"); return; }
    if(/^[1-6][ab]$/.test(t)) out.push(t);
  });
  return [...new Set(out)].sort();
}
function partsAbs(s){
  const m = {};
  (s.abs || []).forEach(c => { const n = c[0]; m[n] = (m[n] || 0) + 1; });
  return m;
}
function resumeAbs(s){
  const m = partsAbs(s), cles = Object.keys(m);
  if(!cles.length) return "";
  const pleines = cles.filter(k => m[k] === 2).length;
  const demies = cles.filter(k => m[k] === 1).length;
  const bouts = [];
  if(pleines) bouts.push(pleines + " abs.");
  if(demies) bouts.push(demies + (demies > 1 ? " partielles" : " partielle"));
  return bouts.join(" · ");
}
function absTexte(s){
  const m = partsAbs(s);
  return Object.keys(m).sort().map(n => m[n] === 2
    ? "S" + n + " complète"
    : (s.abs.includes(n + "a") ? "S" + n + " 1re partie" : "S" + n + " 2e partie")
  ).join(" · ");
}
const fmt = n => n===null||n===undefined ? "—" : (Math.round(n*100)/100).toFixed(2).replace(".",",");
const cls = n => n===null ? "" : n>=14 ? "good" : n>=10 ? "mid" : "low";
const initials = s => ((s.prenom||"")[0]||"") + ((s.nom||"")[0]||"") || "?";
const full = s => (s.nom + " " + s.prenom).trim();

/* ---------------- rendu ---------------- */
function renderStats(){
  const n = state.students.length;
  const notes = state.students.map(moyenne).filter(x => x !== null);
  const m = notes.length ? notes.reduce((a,b)=>a+b,0)/notes.length : null;
  const avecPhoto = state.students.filter(s => s.photo).length;
  el("#promo").textContent = "Management Agile · " + (n ? n + " étudiants" : "HEM");
  el("#stats").innerHTML = [
    ["Moyenne classe", fmt(m)],
    ["Étudiants notés", notes.length + " / " + n],
    ["Photos prises", avecPhoto + " / " + n],
    ["Dossiers complets", state.students.filter(complete).length + " / " + n]
  ].map(([l,v]) => '<div class="stat"><b class="num">'+v+'</b><span>'+l+'</span></div>').join("");
}

function avatar(s){
  const src = s.photo && photos[s.photo];
  return src
    ? '<span class="ava"><img alt="" src="'+src+'"></span>'
    : '<span class="ava" aria-hidden="true">'+esc(initials(s))+'</span>';
}

function sorted(){
  let rows = state.students.slice();
  const q = state.q.trim().toLowerCase();
  if(q) rows = rows.filter(s => full(s).toLowerCase().includes(q));
  const byName = (a,b) => full(a).localeCompare(full(b),"fr");
  if(state.sort === "nom") rows.sort(byName);
  else if(state.sort === "todo") rows.sort((a,b)=> (complete(a)?1:0)-(complete(b)?1:0) || byName(a,b));
  else if(state.sort === "nophoto") rows.sort((a,b)=> (a.photo?1:0)-(b.photo?1:0) || byName(a,b));
  else rows.sort((a,b)=>{
    const ma = moyenne(a), mb = moyenne(b);
    if(ma===null && mb===null) return byName(a,b);
    if(ma===null) return 1; if(mb===null) return -1;
    return state.sort==="desc" ? mb-ma : ma-mb;
  });
  return rows;
}

let lastSlot = null;
function wireSheet(s){
  el("#x").onclick = closeSheet;

  document.querySelectorAll('.slot input').forEach(inp => {
    inp.addEventListener("focus", () => { lastSlot = inp; });
    inp.addEventListener("change", () => {
      const v = parseNote(inp.value);
      s[inp.dataset.kind][+inp.dataset.i] = v;
      inp.value = v===null ? "" : String(v).replace(".",",");
      inp.parentElement.classList.toggle("filled", v!==null);
      save(s); renderStats(); renderList(); refreshTotals(s);
    });
  });

  const ex = el("#examen");
  ex.addEventListener("focus", () => { lastSlot = ex; });
  ex.addEventListener("change", () => {
    s.examen = parseNote(ex.value);
    ex.value = s.examen===null ? "" : String(s.examen).replace(".",",");
    save(s); renderStats(); renderList(); refreshTotals(s);
  });

  el("#quickA").addEventListener("click", e => {
    const b = e.target.closest(".quick"); if(!b) return;
    if(!lastSlot){ toast("Touchez d’abord une case de séance."); return; }
    lastSlot.value = b.dataset.v === "x" ? "" : b.dataset.v;
    lastSlot.dispatchEvent(new Event("change"));
  });

  document.querySelectorAll('.absbtn').forEach(b => {
    b.onclick = () => {
      const code = b.dataset.abs, i = s.abs.indexOf(code);
      if(i < 0) s.abs.push(code); else s.abs.splice(i, 1);
      s.abs.sort();
      b.setAttribute("aria-pressed", i < 0 ? "true" : "false");
      save(s); renderList();
    };
  });

  let memoT;
  el("#memo").addEventListener("input", e => {
    s.memo = e.target.value;
    clearTimeout(memoT); memoT = setTimeout(()=>save(s), 700);
  });

  el("#shoot").onclick = () => pickPhoto(s.id);
  const un = el("#unshoot");
  if(un) un.onclick = () => { s.photo = null; save(s); renderSheet(); renderList(); renderStats(); };
  el("#rename").onclick = () => addSheet(s);
  el("#remove").onclick = () => removeSheet(s);
}

function refreshTotals(s){
  const t = document.querySelector(".total"); if(!t) return;
  t.querySelector("b").textContent = fmt(moyenne(s));
  const sp = t.querySelectorAll(".detail span");
  sp[0].textContent = "Quiz " + fmt(meanQuiz(s.quiz));
  sp[1].textContent = "Ateliers " + fmt(mean(s.ateliers));
  sp[2].textContent = "Examen " + fmt(s.examen);
}

function parseNote(raw){
  const t = String(raw).trim().replace(",",".");
  if(!t) return null;
  const n = Number(t);
  if(!isFinite(n)) return null;
  return Math.round(Math.max(0, Math.min(20, n))*100)/100;
}

    '<div class="card">'
    + '<textarea class="memo" id="imp" style="min-height:190px" placeholder="Abouricha Kenza&#10;Bennani ; Mohamed&#10;3. El Yassaa Hasnaa"></textarea>'
    + '<p class="hint" id="impCount" style="margin:10px 0 0">Aucune ligne pour l’instant.</p>'
    + '<div class="quickrow"><button class="btn" id="impOk">Ajouter à la classe</button></div></div>');
  const ta = el("#imp");
  const count = () => {
    const n = parseList(ta.value).length;
    el("#impCount").textContent = n ? n + (n>1 ? " étudiants reconnus." : " étudiant reconnu.") : "Aucune ligne pour l’instant.";
  };
  ta.addEventListener("input", count);
  el("#impOk").onclick = async () => {
    const rows = parseList(ta.value);
    if(!rows.length){ toast("Rien à ajouter."); return; }
    el("#impOk").disabled = true;
    el("#impCount").textContent = "Ajout en cours…";
    const nouveaux = rows.map(r => Object.assign({ id:newId(), nom:r.nom, prenom:r.prenom }, blank()));
    state.students.push(...nouveaux);
    cache(); closeSheet(); render();
    try{
      await api("enregistrer", { etudiants: nouveaux.map(versApi) });
      toast(nouveaux.length + (nouveaux.length>1 ? " étudiants ajoutés." : " étudiant ajouté."));
    }catch(_){
      nouveaux.forEach(s => enFile(s.id));
      toast("Ajoutés ici ; envoi à la feuille dès que possible.");
    }
    renderList();
  };
  setTimeout(() => ta.focus(), 60);
}

function parseList(text){
  return String(text).split(/\r?\n/).map(l => {
    let t = l.trim();
    if(!t) return null;
    t = t.replace(/^\s*\d+\s*[.)\-–]\s*/, "");        // numérotation en tête
    if(!t) return null;
    let nom, prenom;
    const sep = t.match(/^(.+?)\s*[;,\t|]\s*(.+)$/);   // séparateur explicite
    if(sep){ nom = sep[1]; prenom = sep[2]; }
    else{
      const parts = t.split(/\s+/);
      if(parts.length === 1){ nom = parts[0]; prenom = ""; }
      else { prenom = parts.pop(); nom = parts.join(" "); }
    }
    return { nom: nom.trim(), prenom: prenom.trim() };
  }).filter(Boolean);
}

/* ---------------- photo ---------------- */
let photoFor = null;
function pickPhoto(id){
  if(!state.cfg){ toast("Configurez d’abord l’accès à votre feuille Google."); return; }
  photoFor = id;
  el("#picker").click();
}
el("#picker").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!file || !photoFor) return;
  const s = find(photoFor); photoFor = null;
  if(!s) return;
  try{
    toast("Envoi de la photo…");
    const data = await carre(file, 384);          // base64 sans en-tête
    const rep = await api("photo", { id: s.id, data });
    s.photo = rep.photo;
    photos[rep.photo] = "data:image/jpeg;base64," + data;
    idb.set(rep.photo, data);
    save(s);
    render(); if(state.open === s.id) renderSheet();
    toast("Photo enregistrée dans votre Drive.");
  }catch(err){
    toast("La photo n’a pas pu être envoyée. Réessayez avec du réseau.");
  }
});
function carre(file, size){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = size;
      const ctx = c.getContext("2d");
      const k = Math.max(size/img.width, size/img.height);
      const w = img.width*k, h = img.height*k;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.82).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("lecture")); };
    img.src = url;
  });
}

async function chargerPhotos(){
  const manquantes = state.students.filter(s => s.photo && !photos[s.photo]);
  let nouvelle = false;
  for(const s of manquantes){
    let data = await avecDelai(idb.get(s.photo), 2000, null);
    if(!data){
      try{ const r = await api("lirePhoto", { photo: s.photo }); data = r.data; idb.set(s.photo, data); }
      catch(_){ continue; }
    }
    photos[s.photo] = "data:image/jpeg;base64," + data;
    nouvelle = true;
  }
  if(nouvelle){ render(); if(state.open) renderSheet(); }
}

/* ---------------- persistance ---------------- */
function versApi(s){
  return { id:s.id, nom:s.nom, prenom:s.prenom, quiz:s.quiz, ateliers:s.ateliers,
           examen:s.examen, abs:s.abs, memo:s.memo, photo:s.photo };
}
function cache(){ ecrire(K_CACHE, state.students); }
function enFile(id){
  if(!state.file.includes(id)) state.file.push(id);
  ecrire(K_FILE, state.file);
  etatSync("wait");
}

const enCours = new Set();
let minuteurs = {};
function save(s){
  cache();
  clearTimeout(minuteurs[s.id]);
  minuteurs[s.id] = setTimeout(() => envoyer(s.id), 400);   // on groupe les frappes rapides
}

async function envoyer(id){
  const s = find(id);
  if(!s || !state.cfg || enCours.has(id)) return;
  enCours.add(id);
  try{
    await api("enregistrer", { etudiants: [versApi(s)] });
    const i = state.file.indexOf(id);
    if(i >= 0){ state.file.splice(i,1); ecrire(K_FILE, state.file); }
    etatSync(state.file.length ? "wait" : "ok");
    if(!state.file.length) banner("");
    renderList();
  }catch(err){
    enFile(id);
    banner(err && err.cle
      ? "Clé refusée : ouvrez les réglages pour la corriger."
      : "Pas de liaison avec la feuille Google. Vos saisies sont gardées ici et seront envoyées automatiquement.", "bad");
    renderList();
  }finally{
    enCours.delete(id);
  }
}

async function viderFile(){
  if(!state.cfg || !state.file.length || !navigator.onLine) return;
  for(const id of state.file.slice()) await envoyer(id);
}

async function charger(silencieux){
  if(!state.cfg) return;
  if(!silencieux) etatSync("wait");
  try{
    const rep = await api("liste");
    const distants = (rep.etudiants || []).map(e => {
      const o = Object.assign(blank(), e); o.abs = normAbs(o.abs); return o;
    });
    // ce qui attend d'être envoyé reste prioritaire sur la version distante
    const enAttente = new Set(state.file);
    const locaux = state.students.filter(s => enAttente.has(s.id));
    state.students = distants
      .filter(d => !enAttente.has(d.id))
      .concat(locaux);
    cache(); render();
    etatSync(state.file.length ? "wait" : "ok");
    if(!state.file.length) banner("");
    chargerPhotos();
    viderFile();
  }catch(err){
    etatSync("off");
    if(err && err.cle) banner("Clé refusée : ouvrez les réglages pour la corriger.", "bad");
    else if(!silencieux) banner("Feuille Google injoignable. L’application fonctionne avec les données de cet appareil.", "bad");
  }
}

function etatSync(e){
  state.sync = e;
  const b = el("#sync");
  b.title = e === "ok" ? "À jour avec Google Sheets"
          : e === "wait" ? "Des saisies attendent d’être envoyées"
          : "Hors liaison";
  b.style.color = e === "ok" ? "var(--good)" : e === "wait" ? "var(--gold)" : "";
}

/* ---------------- export ---------------- */
function csv(){
  const head = ["Nom","Prénom","Quiz 1","Quiz 2","Quiz 3","Quiz 4","Quiz 5","Quiz 6","Moyenne quiz",
    "Atelier S1","Atelier S2","Atelier S3","Atelier S4","Atelier S5","Atelier S6","Moyenne ateliers",
    "Examen final","Moyenne générale","Absences","Commentaire"];
  const n = v => v===null||v===undefined ? "" : String(Math.round(v*100)/100).replace(".",",");
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  const lines = [head.map(q).join(";")];
  state.students.slice().sort((a,b)=>full(a).localeCompare(full(b),"fr")).forEach(s => {
    lines.push([s.nom, s.prenom, ...s.quiz.map(n), n(meanQuiz(s.quiz)),
      ...s.ateliers.map(n), n(mean(s.ateliers)), n(s.examen), n(moyenne(s)),
      absTexte(s), s.memo].map(q).join(";"));
  });
  return "﻿" + lines.join("\r\n");
}
el("#export").onclick = () => {
  const nom = "Notes Management Agile - " + new Date().toISOString().slice(0,10) + ".csv";
  try{
    const blob = new Blob([csv()], { type:"text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nom;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast("Fichier téléchargé.");
  }catch(_){
    shell("Export des notes", "Copiez ce tableau et collez-le dans Excel.",
      '<div class="card"><textarea class="memo" style="min-height:220px;font-size:12px" readonly id="csvbox"></textarea>'
      + '<div class="quickrow"><button class="quick" id="copy">Tout copier</button></div></div>');
    el("#csvbox").value = csv();
    el("#copy").onclick = async () => {
      const box = el("#csvbox"); box.select();
      try{ await navigator.clipboard.writeText(box.value); toast("Copié."); }
      catch(_){ toast("Sélectionnez le texte puis copiez-le."); }
    };
  }
};

/* ---------------- divers ---------------- */
let toastT;
function toast(msg){
  let t = document.querySelector(".toast");
  if(!t){ t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2800);
}
function banner(msg, type){
  el("#banner").innerHTML = msg ? '<div class="banner'+(type?" "+type:"")+'">'+msg+'</div>' : '';
}

el("#list").addEventListener("click", e => { const b = e.target.closest(".open"); if(b) openSheet(b.dataset.id); });
el("#faces").addEventListener("click", e => { const b = e.target.closest(".face"); if(b) openSheet(b.dataset.id); });
el("#sheet").addEventListener("click", e => { if(e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && el("#sheet").dataset.open === "1") closeSheet(); });
el("#q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
el("#sort").addEventListener("change", e => { state.sort = e.target.value; renderList(); });
el("#add").onclick = () => addSheet();
el("#reglages").onclick = reglagesSheet;
el("#sync").onclick = () => { charger(false); toast("Actualisation…"); };
el("#vList").onclick = () => { state.view = "list"; el("#vList").setAttribute("aria-pressed","true"); el("#vFaces").setAttribute("aria-pressed","false"); renderList(); };
el("#vFaces").onclick = () => { state.view = "faces"; el("#vFaces").setAttribute("aria-pressed","true"); el("#vList").setAttribute("aria-pressed","false"); renderList(); };
el("#theme").onclick = () => {
  const r = document.documentElement;
  const sombre = r.getAttribute("data-theme") === "dark"
    || (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme", sombre ? "light" : "dark");
  ecrire(K_THEME, sombre ? "light" : "dark");
};

window.addEventListener("online", () => { viderFile(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden) charger(true); });

/* ---------------- démarrage ---------------- */
(async function(){
  const th = lire(K_THEME, null);
  if(th) document.documentElement.setAttribute("data-theme", th);
  // le navigateur est prié de ne pas faire le ménage dans nos données
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(_){}
  state.cfg = await cfgLire();
  if(state.cfg) cfgEcrire(state.cfg);          // on réécrit partout ce qui a survécu
  state.file = lire(K_FILE, []);
  const cached = lire(K_CACHE, []);
  if(Array.isArray(cached)) state.students = cached.map(s => {
    const o = Object.assign(blank(), s); o.abs = normAbs(o.abs); return o;
  });
  etatSync(state.cfg ? "wait" : "off");
  render();
  chargerPhotos();
  charger(true);
  setInterval(viderFile, 30000);
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
